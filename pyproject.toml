[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "issuematch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "pydantic>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
    "uvicorn>=0.29.0",
    "boto3>=1.40",
    "strands-agents[ollama]>=1.56.0,<2.0.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["frontend*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
